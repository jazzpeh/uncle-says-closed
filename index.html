<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Is your hawker centre open today? Uncle checks NEA's closure dates and points you to the nearest open one." />
    <meta name="theme-color" content="#c4161c" />
    <title>Uncle Says Closed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c4161c'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff6d6' font-family='sans-serif' font-weight='900'%3EU%3C/text%3E%3C/svg%3E" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="signboard">
      <a class="signboard__name" href="#/">Uncle Says Closed</a>
      <p class="signboard__strip">Hawker centre open or not? Uncle tells you straight.</p>
    </header>

    <main id="main">
      <p class="loading" id="loading">Uncle checking the list…</p>
      <section id="error" hidden></section>

      <section id="home" hidden>
        <form class="finder" id="finder" role="search">
          <label class="finder__label" for="q">Which hawker centre?</label>
          <div class="finder__row">
            <input id="q" name="q" type="search" autocomplete="off" placeholder="Try Maxwell or Old Airport Road" />
            <button type="button" id="near-me" class="button">Near me</button>
          </div>
          <p class="finder__note" id="geo-note" role="status"></p>
        </form>
        <p class="sr-only" id="result-count" aria-live="polite"></p>
        <ul class="centre-list" id="results" aria-label="Centres found"></ul>

        <section class="board" aria-labelledby="board-title">
          <h2 class="board__title" id="board-title">Uncle's bad news board</h2>
          <div id="board"></div>
        </section>
      </section>

      <article id="centre" hidden></article>
    </main>

    <footer class="footer" id="footer"></footer>
  </body>
</html>
